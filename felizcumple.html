<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sección Especial - Bloc de Notas Win95</title>
  <link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@300;400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #222;
      color: #ffffff;
      font-family: 'Afacad Flux', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    
    #btnYaEsHora {
      background-color: #80182e;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 1.1rem;
      padding: 18px 32px;
      border: 4px solid #000000;
      box-shadow: 
        -4px -4px 0px 0px #ff6688 inset,
        4px 4px 0px 0px #800020 inset,
        6px 6px 0px 0px #000000;
      cursor: pointer;
      z-index: 1000;
      animation: latido 1.5s infinite;
      transition: transform 0.1s ease, opacity 0.5s ease;
    }

    #btnYaEsHora:active {
      transform: translate(-2px, -2px);
      box-shadow: 2px 2px 0px 0px #000000;
    }

    #btnYaEsHora.ocultar {
      opacity: 0;
      pointer-events: none;
      display: none;
    }

    @keyframes latido {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    
    .contenido-oculto {
      display: none;
      opacity: 0;
      flex-direction: column;
      align-items: center;
      width: 100%;
      transition: opacity 0.8s ease;
    }

    .contenido-oculto.mostrar {
      display: flex;
      opacity: 1;
    }

    .seccion-cumpleanos {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 600px;
      position: relative;
      overflow: hidden;
      padding-top: 45px;
    }

    
    .notification-banner {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) translateY(-100%);
      width: 90%;
      max-width: 320px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      color: #111;
      padding: 8px;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      font-size: 0.9rem;
      font-weight: 500;
      text-align: center;
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 30;
      border: 1px solid rgba(0,0,0,0.15);
      border-top: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .notification-banner.show {
      transform: translateX(-50%) translateY(0);
    }

    
    .notification-banner img {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }

    .balloon-title-img {
      width: 100%;
      max-width: 420px;
      height: auto;
      margin-bottom: -10px;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.7));
      z-index: 6;
    }


    .notepad-window {
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #808080;
      border-bottom: 2px solid #808080;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.8);
      width: 100%;
      max-width: 520px;
      text-align: left;
      font-family: Arial, sans-serif;
      position: relative;
    }

    .notepad-header {
      background: #808080;
      color: #ffffff;
      padding: 3px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 0.8rem;
      border-bottom: 1px solid #404040;
    }

    .notepad-title-left {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .notepad-buttons {
      display: flex;
      gap: 2px;
    }

    .notepad-buttons span {
      background: #c0c0c0;
      color: black;
      width: 16px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: bold;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 1px solid #808080;
      border-bottom: 1px solid #808080;
      cursor: pointer;
    }

    .notepad-menu {
      background: #c0c0c0;
      display: flex;
      padding: 2px;
      font-size: 0.75rem;
    }

    .menu-item {
      position: relative;
      padding: 2px 6px;
      color: black;
      cursor: pointer;
    }

    .menu-item:hover, .menu-item.activo {
      background: #000080;
      color: white;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: #c0c0c0;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 2px solid #808080;
      border-bottom: 2px solid #808080;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
      list-style: none;
      min-width: 140px;
      z-index: 100;
    }

    .dropdown-menu li {
      padding: 4px 12px;
      color: black;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .dropdown-menu li:hover {
      background: #000080;
      color: white;
    }

    .menu-item.activo .dropdown-menu {
      display: block;
    }

    .notepad-body-container {
      margin: 3px;
      background: #c0c0c0;
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      display: grid;
      grid-template-columns: 1fr 16px;
      grid-template-rows: 1fr 16px;
      height: 220px;
    }

    .notepad-content {
      background: #000000;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notepad-content video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scrollbar-vertical {
      background: #c0c0c0;
      border-left: 1px solid #808080;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .scrollbar-horizontal {
      background: #c0c0c0;
      border-top: 1px solid #808080;
      grid-column: span 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }

    .scroll-thumb-v {
      background: #c0c0c0;
      width: 14px;
      height: 40px;
      margin: 16px 1px;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 1px solid #808080;
      border-bottom: 1px solid #808080;
    }

    .scroll-btn {
      background: #c0c0c0;
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 1px solid #808080;
      border-bottom: 1px solid #808080;
      font-size: 0.5rem;
    }

    .stickers-decorativos {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 560px;
      margin-top: -20px;
      pointer-events: none;
    }

    .sticker-izq, .sticker-der {
      width: 90px;
      height: auto;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
    }
  </style>
</head>
<body>

  <button id="btnYaEsHora" onclick="revelarExperiencia()">¡Ya es hora!!!</button>

  <div id="contenedorPrincipal" class="contenido-oculto">
    <div class="seccion-cumpleanos">
      <div id="notificationBanner" class="notification-banner"></div>

      <img src="imagenes/nu.png" alt="¡Feliz Cumpleaños!" class="balloon-title-img">
      
      <div class="notepad-window">
        <div class="notepad-header">
          <div class="notepad-title-left">
            <span>📄</span>
            <span>- - Notepad</span>
          </div>
          <div class="notepad-buttons">
            <span>_</span>
            <span>□</span>
            <span>×</span>
          </div>
        </div>

        <div class="notepad-menu">
          <div class="menu-item" onclick="mostrarMultimedia('imagenes/yo.png', this)">File</div>
          
          <div class="menu-item" onclick="toggleMenu(this)">
            Edit
            <ul class="dropdown-menu">
              <li onclick="mostrarNotificacion('tanto me odias? Ó⁠╭⁠╮⁠Ò')">Eliminar</li>
              <li onclick="mostrarNotificacion('Espero que todos tus sueños se cumplan no solo porque lo desees hoy 🎂❤️')">Ver detalles</li>
              <li onclick="mostrarNotificacion('Solo decirte te quiero no alcanza hoy, así que te quiero tres millones y un poquitito más 🎀')">Ver opciones</li>
            </ul>
          </div>

          <div class="menu-item" onclick="mostrarMultimedia('imagenes/snu.gif', this)">Search</div>

          <div class="menu-item" onclick="toggleMenu(this)">
            Help
            <ul class="dropdown-menu">
              <li onclick="mostrarNotificacion('si ves esto quiere decir que te debo mil besos y lo que tú quieras sin excepciónes ni límites de nada puedes reclamarlo cuando sea 🎟️🎉')">Ver soluciones</li>
              <li onclick="mostrarNotificacion('Eres el hombre más importante para mí siempre voy a estar orgullosa de todo lo que hagas aunque no esté para verlo 🌟')">Más...</li>
            </ul>
          </div>
        </div>

        <div class="notepad-body-container">
          <div class="notepad-content">
            <video id="videoCumple" src="imagenes/tu-video.mp4" loop muted playsinline></video>
          </div>
          <div class="scrollbar-vertical">
            <div class="scroll-btn">▲</div>
            <div class="scroll-thumb-v"></div>
            <div class="scroll-btn">▼</div>
          </div>
          <div class="scrollbar-horizontal">
            <div class="scroll-btn">◀</div>
            <div class="scroll-btn">▶</div>
          </div>
        </div>
      </div>

      <div class="stickers-decorativos">
        <img src="imagenes/li1.png" alt="Sticker Izquierda" class="sticker-izq">
        <img src="imagenes/li2.png" alt="Sticker Derecha" class="sticker-der">
      </div>
    </div>
  </div>

  <script>
    let timerOcultar = null;

    function revelarExperiencia() {
      
      const btn = document.getElementById('btnYaEsHora');
      btn.classList.add('ocultar');

      
      const contenedor = document.getElementById('contenedorPrincipal');
      contenedor.classList.add('mostrar');

      
      const audioConfeti = new Audio('Audio/confeti.mp3');
      audioConfeti.volume = 0.8;
      audioConfeti.play().catch(e => console.log("Audio de confeti bloqueado:", e));

      
      const video = document.getElementById('videoCumple');
      if(video) {
        video.muted = false;
        video.play().catch(e => console.log("Video autoplay bloqueado:", e));
      }

  
      const duracion = 3 * 1000;
      const fin = Date.now() + duracion;

      (function frame() {
        confetti({
          particleCount: 5,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          zIndex: 9999,
          colors: ['#80182e', '#ff0033', '#ff4d6d', '#800020', '#ffffff']
        });
        confetti({
          particleCount: 5,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          zIndex: 9999,
          colors: ['#80182e', '#ff0033', '#ff4d6d', '#800020', '#ffffff']
        });

        if (Date.now() < fin) {
          requestAnimationFrame(frame);
        }
      }());
    }

    function toggleMenu(elemento) {
      document.querySelectorAll('.menu-item').forEach(item => {
        if (item !== elemento) item.classList.remove('activo');
      });
      elemento.classList.toggle('activo');
    }

    window.onclick = function(event) {
      if (!event.target.closest('.menu-item')) {
        document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('activo'));
      }
    }

    function mostrarNotificacion(texto) {
      const banner = document.getElementById('notificationBanner');
      banner.innerHTML = `<span>${texto}</span>`;
      banner.classList.add('show');

      if (timerOcultar) clearTimeout(timerOcultar);

      timerOcultar = setTimeout(() => {
        banner.classList.remove('show');
      }, 4000);
    }

    function mostrarMultimedia(rutaMultimedia, elemento) 
      document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('activo'));

      const banner = document.getElementById('notificationBanner');
      banner.innerHTML = `
        <img src="${rutaMultimedia}" alt="Imagen especial">
      `;
      banner.classList.add('show');

      if (timerOcultar) clearTimeout(timerOcultar);

      timerOcultar = setTimeout(() => {
        banner.classList.remove('show');
      }, 4000);
    }
  </script>

</body>
</html>
