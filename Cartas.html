<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartas para ti ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent; /* 🚫 Quita el resplandor azul al tocar */
      user-select: none; /* 🚫 Evita la selección accidental de texto */
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      min-height: 100lvh; /* 📱 Adapta la altura exacta en móviles */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 15px 30px 15px;
      overflow-x: hidden;
      overflow-y: auto; /* 📜 Permite desplazamiento si la pantalla es baja */
      position: relative;
    }

    /* ⬅️ Botón para regresar a rr.html */
    .boton-regresar {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      color: #ffffff;
      font-size: clamp(1.8rem, 5vw, 2.2rem);
      text-decoration: none;
      font-family: 'Playfair Display', serif;
      line-height: 1;
      opacity: 0.8;
      transition: opacity 0.3s ease, transform 0.3s ease;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .boton-regresar:hover {
      opacity: 1;
      transform: translateX(-3px);
    }

    .titulo {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 5vw, 1.8rem);
      margin-bottom: clamp(60px, 12vh, 90px); /* Margen dinámico para dar espacio cuando la carta sube */
      letter-spacing: 1px;
      color: #f4efe6;
      text-align: center;
    }

    /* Pila de Cartas Responsiva */
    .pila-container {
      position: relative;
      width: clamp(250px, 80vw, 290px);
      height: clamp(280px, 90vw, 320px);
      margin-bottom: 20px;
    }

    .carta {
      position: absolute;
      width: 100%;
      height: 100%;
      cursor: pointer;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    /* Posicionamiento inicial en mazo */
    .carta:nth-child(1) { z-index: 5; transform: translateY(0) rotate(0deg); }
    .carta:nth-child(2) { z-index: 4; transform: translateY(8px) rotate(-3deg); opacity: 0.98; }
    .carta:nth-child(3) { z-index: 3; transform: translateY(16px) rotate(3deg); opacity: 0.95; }
    .carta:nth-child(4) { z-index: 2; transform: translateY(24px) rotate(-2deg); opacity: 0.92; }
    .carta:nth-child(5) { z-index: 1; transform: translateY(32px) rotate(2deg); opacity: 0.9; }

    /* Estructura del Sobre */
    .sobre-contenedor {
      position: relative;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
    }

    /* Solapa trasera (Punta visible ^) */
    .sobre-solapa-trasera {
      position: absolute;
      top: -14%;
      left: 0;
      width: 100%;
      height: 38%;
      background-color: #5c1020;
      clip-path: polygon(0 100%, 50% 0, 100% 100%);
      border-top-left-radius: 4px;
      border-top-right-radius: 4px;
    }

    /* Fondo interior */
    .sobre-fondo-interior {
      position: absolute;
      top: 12%;
      left: 0;
      width: 100%;
      height: 56%;
      background-color: #4a0d1a;
      border-radius: 6px;
    }

    /* Tarjeta de papel beige (Vertical y alargada) */
    .tarjeta-papel {
      position: absolute;
      top: 3%;
      left: 6%;
      width: 88%;
      height: 75%;
      background-color: #f5f0eb;
      color: #1a1a1a;
      border-radius: 6px;
      padding: 15px 12px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      transition: transform 0.4s ease;
      overflow: hidden; /* Mantiene el sticker dentro del borde del papel */
    }

    .vista-previa-texto {
      font-size: clamp(0.75rem, 2.5vw, 0.85rem);
      line-height: 1.4;
      text-align: center;
      font-weight: 600;
      color: #2b2b2b;
      margin-top: 5px;
    }

    /* Estilo para los stickers 🐱🐶 */
    .sticker {
      position: absolute;
      bottom: 5px;
      right: 8px;
      width: clamp(60px, 20vw, 80px);
      height: auto;
      pointer-events: none; /* Permite hacer clic a través de la imagen */
    }

    /* Frente del sobre rojo */
    .sobre-frente {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 56%;
      background-color: #80182e;
      z-index: 3;
      clip-path: polygon(0 40%, 50% 0, 100% 40%, 100% 100%, 0 100%);
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
    }

    /* ANIMACIÓN: El papel sube de forma adaptable */
    .carta.abierta .tarjeta-papel {
      transform: translateY(-42%);
    }

    .carta.abierta .vista-previa-texto {
      font-weight: 400;
      font-size: clamp(0.72rem, 2.4vw, 0.82rem);
    }

    /* Botón Rojo Vino en la 5ta carta */
    .btn-seguis {
      display: none;
      margin-top: 10px;
      background-color: #80182e;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      font-size: 0.78rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1px;
      z-index: 10;
    }

    .carta.abierta .btn-seguis {
      display: inline-block;
    }
  </style>
</head>
<body>

  <!-- ⬅️ Flecha para volver a la primera etapa (rr.html) -->
  <a href="index.html" class="boton-regresar" aria-label="Volver">‹</a>

  <h2 class="titulo">Cartas para ti ✨</h2>

  <!-- Pila de Cartas -->
  <div class="pila-container" id="pila">
    
    <!-- Carta 1 -->
    <div class="carta" onclick="manejarClicCarta(this, 0)">
      <div class="sobre-contenedor">
        <div class="sobre-solapa-trasera"></div>
        <div class="sobre-fondo-interior"></div>
        <div class="tarjeta-papel">
          <p class="vista-previa-texto">Carta #1: Algo que quería decirte... ❤️</p>
          <img src="imagenes/cat1.png" alt="Sticker Gatito" class="sticker">
        </div>
        <div class="sobre-frente"></div>
      </div>
    </div>

    <!-- Carta 2 -->
    <div class="carta" onclick="manejarClicCarta(this, 1)">
      <div class="sobre-contenedor">
        <div class="sobre-solapa-trasera"></div>
        <div class="sobre-fondo-interior"></div>
        <div class="tarjeta-papel">
          <p class="vista-previa-texto">Carta #2: Un recuerdo muy especial... 🌟</p>
          <img src="imagenes/dog1.png" alt="Sticker Perrito" class="sticker">
        </div>
        <div class="sobre-frente"></div>
      </div>
    </div>

    <!-- Carta 3 -->
    <div class="carta" onclick="manejarClicCarta(this, 2)">
      <div class="sobre-contenedor">
        <div class="sobre-solapa-trasera"></div>
        <div class="sobre-fondo-interior"></div>
        <div class="tarjeta-papel">
          <p class="vista-previa-texto">Carta #3: Una pequeña promesa... ✉️</p>
          <img src="imagenes/cat2.png" alt="Sticker Gatito" class="sticker">
        </div>
        <div class="sobre-frente"></div>
      </div>
    </div>

    <!-- Carta 4 -->
    <div class="carta" onclick="manejarClicCarta(this, 3)">
      <div class="sobre-contenedor">
        <div class="sobre-solapa-trasera"></div>
        <div class="sobre-fondo-interior"></div>
        <div class="tarjeta-papel">
          <p class="vista-previa-texto">Carta #4: Un detalle importante... 🌹</p>
          <img src="imagenes/dog2.png" alt="Sticker Perrito" class="sticker">
        </div>
        <div class="sobre-frente"></div>
      </div>
    </div>

    <!-- Carta 5 (Con botón ¿Seguís?) -->
    <div class="carta" onclick="manejarClicCarta(this, 4)">
      <div class="sobre-contenedor">
        <div class="sobre-solapa-trasera"></div>
        <div class="sobre-fondo-interior"></div>
        <div class="tarjeta-papel">
          <p class="vista-previa-texto">Carta #5: El último mensaje... ✨</p>
          <button class="btn-seguis" onclick="irASiguientePagina(event)">¿Seguís?</button>
          <img src="imagenes/cat3.png" alt="Sticker Gatito" class="sticker">
        </div>
        <div class="sobre-frente"></div>
      </div>
    </div>

  </div>

  <script>
    const textosCompletos = [
      "Esta es la primera carta completa. Aquí puedes escribir todo tu mensaje con comodidad.",
      "Este es el segundo mensaje especial guardado en este sobre.",
      "Aquí va el tercer mensaje lleno de detalles bonitos.",
      "Cuarta carta con otro pensamiento especial dedicado para ti.",
      "Llegaste al final de las cartas. ¿Listo para descubrir el siguiente paso?"
    ];

    const textosVistasPrevias = [
      "Carta #1: Algo que quería decirte... ❤️",
      "Carta #2: Un recuerdo muy especial... 🌟",
      "Carta #3: Una pequeña promesa... ✉️",
      "Carta #4: Un detalle importante... 🌹",
      "Carta #5: El último mensaje... ✨"
    ];

    let procesandoAnimacion = false;

    function manejarClicCarta(elementoCarta, index) {
      if (procesandoAnimacion) return;

      const pila = document.getElementById('pila');
      if (elementoCarta !== pila.firstElementChild) return;

      if (elementoCarta.classList.contains('abierta')) {
        deslizarYCambiarCarta(elementoCarta, index);
        return;
      }

      const textoElemento = elementoCarta.querySelector('.vista-previa-texto');
      textoElemento.innerText = textosCompletos[index];
      elementoCarta.classList.add('abierta');
    }

    function deslizarYCambiarCarta(elementoCarta, index) {
      procesandoAnimacion = true;

      elementoCarta.style.transform = 'translate(-150%, 0) rotate(-10deg)';
      elementoCarta.style.opacity = '0';

      setTimeout(() => {
        elementoCarta.classList.remove('abierta');

        const textoElemento = elementoCarta.querySelector('.vista-previa-texto');
        textoElemento.innerText = textosVistasPrevias[index];

        const pila = document.getElementById('pila');
        pila.appendChild(elementoCarta);

        elementoCarta.style.transform = '';
        elementoCarta.style.opacity = '';

        procesandoAnimacion = false;
      }, 500);
    }

    // ➡️ Redirección ajustada a temporizador.html
    function irASiguientePagina(event) {
      event.stopPropagation();
      window.location.href = 'temporizador.html';
    }
  </script>

</body>
</html>
