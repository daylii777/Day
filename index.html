<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Y si hasta en la música te encuentro?</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@300;400;500;600&family=Italianno&family=Roboto+Condensed:ital,wght@0,300;0,400;0,700;1,300&family=Stoke:wght@400&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#0d0d0d;color:#f4efe6;
  font-family:'Roboto Condensed',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow-x:hidden;padding:15px
}

.background-overlay{
  position:fixed;top:0;left:0;width:100vw;height:100lvh;
  background-image:linear-gradient(to bottom,rgba(0,0,0,.6),rgba(0,0,0,.9)),url('imagenes/fondo.jpg');
  background-size:cover;background-position:center;background-repeat:no-repeat;
  filter:grayscale(100%) contrast(110%);z-index:-1;transform:translateZ(0)
}

.header-phrase{
  font-family:'Italianno',cursive;font-weight:400;color:#fff;
  font-size:clamp(2.2rem,7vw,3.5rem);text-align:center;
  margin-top:5px;margin-bottom:25px;
  transition:opacity .8s ease,transform .8s ease;
  text-shadow:0 4px 12px rgba(0,0,0,.9)
}
.header-phrase.fade-out{opacity:0;transform:translateY(-20px);pointer-events:none}

.vinyl-container,.ctrl-icon-btn,.action-btn,.progress-bar{
  -webkit-tap-highlight-color:transparent;outline:none
}

.vinyl-container{
  position:relative;width:260px;height:260px;cursor:pointer;
  user-select:none;margin-bottom:25px;transition:transform .3s ease
}

.sleeve{
  position:absolute;top:0;left:0;width:240px;height:240px;
  background-color:#4a0e17;background-size:cover;background-position:center;
  border:1px solid rgba(255,255,255,.2);border-radius:2px;
  box-shadow:0 8px 25px rgba(0,0,0,.8);z-index:2;
  transition:opacity .6s ease,background-image .5s ease;
  overflow:hidden;display:flex;align-items:center;justify-content:center
}

#puppyVideo{
  width:90%;height:90%;object-fit:cover;border-radius:2px;
  transition:opacity .5s ease
}
.fade-out-video{opacity:0;pointer-events:none}

.record{
  position:absolute;top:10px;right:-20px;width:220px;height:220px;
  background:radial-gradient(circle,#151515 30%,#2b2b2b 31%,#111 70%);
  border-radius:50%;box-shadow:1px 4px 12px rgba(0,0,0,.6);
  z-index:1;display:flex;align-items:center;justify-content:center
}
.record-label{
  width:70px;height:70px;border-radius:50%;background:#4a0e17;
  background-size:cover;background-position:center;
  transition:background-image .5s ease
}
.spinning{animation:spin 3.5s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}

.click-hint{
  position:absolute;bottom:-28px;width:100%;text-align:center;
  font-size:.75rem;color:#ccc;letter-spacing:2px;
  text-transform:uppercase;font-weight:300
}

.jaja-overlay{
  position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,.85);
  display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .6s ease,visibility .6s ease
}
.jaja-overlay.show{
  opacity:1;visibility:visible;pointer-events:auto
}
.jaja-popup{
  width:min(88vw,360px);display:flex;flex-direction:column;
  align-items:center;transform:scale(.92) translateY(15px);
  transition:transform .5s ease
}
.jaja-overlay.show .jaja-popup{
  transform:scale(1) translateY(0)
}
#jajaVideo{
  display:block;width:100%;max-height:60vh;object-fit:contain;
  border-radius:3px;background:#000;
  box-shadow:0 10px 35px rgba(0,0,0,.75);
  transition:opacity .6s ease;
}

.jaja-text{
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.6s ease, transform 0.6s ease;
  margin-top:14px;color:#fff;font-family:'Afacad Flux',sans-serif;
  font-size:1rem;font-weight:400;text-align:center;
  letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.8)
}
.jaja-text.visible{
  opacity: 1;
  transform: translateY(0);
}

.jaja-button{
  display: none;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.6s ease, transform 0.6s ease, background 0.2s ease;
  margin-top:12px;padding:11px 23px;border:0;border-radius:2px;
  background:#581825;color:#fff;
  font-family:'Roboto Condensed',sans-serif;font-size:.9rem;
  font-weight:600;letter-spacing:1.5px;cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,.45);
}
.jaja-button.visible{
  display: inline-block;
  opacity: 1;
  transform: translateY(0);
}
.jaja-button:hover{background:#681c2b;transform:translateY(-2px)}
.jaja-button:active{transform:scale(.96)}

.info-panel{
  max-width:420px;width:90vw;text-align:center;opacity:0;
  transform:translateY(20px);transition:opacity .6s ease,transform .6s ease
}
.info-panel.visible{opacity:1;transform:translateY(0)}
.fade-content{opacity:0!important;transition:opacity .4s ease}

.song-title{
  font-family:'Stoke',serif;font-size:1.4rem;color:#fff;
  margin-bottom:2px;transition:opacity .4s ease
}
.quote-mark{font-family:'Stoke',serif;font-size:1.4rem;margin:0 4px}
.artist-name{
  font-family:'Roboto Condensed',sans-serif;font-size:.95rem;color:#fff;
  font-weight:400;margin-top:5px;margin-bottom:20px;
  text-transform:uppercase;letter-spacing:3px;
  transition:opacity .4s ease
}
.custom-player{width:100%;margin-bottom:20px}
.progress-container{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.time-stamp{font-size:.8rem;color:#ccc;font-weight:400;min-width:35px}
.progress-bar{
  flex-grow:1;height:3px;-webkit-appearance:none;appearance:none;
  background:rgba(255,255,255,.3);outline:none;cursor:pointer
}
.progress-bar::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;border-radius:50%;
  background:#fff;cursor:pointer
}
.player-controls{
  display:flex;align-items:center;justify-content:center;gap:25px
}
.ctrl-icon-btn{
  background:none;border:0;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s ease,opacity .2s ease
}
.ctrl-icon-btn:hover{transform:scale(1.1)}
.ctrl-icon-btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.play-pause-btn{
  width:44px;height:44px;border-radius:50%;background:#fff;color:#000
}

.dedication-box{
  background:#f4efe6;color:#1a1a1a;padding:25px 20px;margin-top:10px;
  margin-bottom:15px;position:relative;font-family:'Afacad Flux',sans-serif;
  font-size:1.05rem;font-weight:400;line-height:1.6;text-align:left;
  box-shadow:0 6px 20px rgba(0,0,0,.6);transition:opacity .4s ease;
  mask:radial-gradient(circle 5px at 10px 0,#0000 99%,#000 100%) 0 -5px/20px 100% repeat-x,
        radial-gradient(circle 5px at 10px 100%,#0000 99%,#000 100%) 0 calc(100% + 5px)/20px 100% repeat-x,
        radial-gradient(circle 5px at 0 10px,#0000 99%,#000 100%) -5px 0/100% 20px repeat-y,
        radial-gradient(circle 5px at 100% 10px,#0000 99%,#000 100%) calc(100% + 5px) 0/100% 20px repeat-y;
  -webkit-mask:radial-gradient(circle 5px at 10px 0,#0000 99%,#000 100%) 0 -5px/20px 100% repeat-x,
        radial-gradient(circle 5px at 10px 100%,#0000 99%,#000 100%) 0 calc(100% + 5px)/20px 100% repeat-x,
        radial-gradient(circle 5px at 0 10px,#0000 99%,#000 100%) -5px 0/100% 20px repeat-y,
        radial-gradient(circle 5px at 100% 10px,#0000 99%,#000 100%) calc(100% + 5px) 0/100% 20px repeat-y
}

.action-btn{
  display:none;margin:25px auto 0;padding:15px 30px;background:#581825;
  color:#fff;border:0;font-family:'Roboto Condensed',sans-serif;
  font-weight:600;font-size:.95rem;letter-spacing:2px;text-transform:uppercase;
  cursor:pointer;transition:all .3s ease
}
.action-btn:hover{background:#581825;transform:translateY(-2px)}

@media(max-width:380px){
  .vinyl-container{transform:scale(.85);margin-bottom:10px}
  .jaja-popup{width:92vw}
  #jajaVideo{max-height:55vh}
}
</style>
</head>

<body>

<div class="background-overlay"></div>

<div class="header-phrase" id="headerPhrase">
  ¿Y si hasta en la música te encuentro?
</div>

<div class="vinyl-container" id="vinylContainer">

  <div class="sleeve" id="sleeve">
    <video id="puppyVideo"
      src="imagenes/Puppy.mp4"
      autoplay muted loop playsinline></video>
  </div>

  <div class="record" id="record">
    <div class="record-label" id="recordLabel"></div>
  </div>

  <div class="click-hint" id="clickHint">
    Toca la portada para comenzar
  </div>

</div>

<div class="jaja-overlay" id="jajaOverlay">

  <div class="jaja-popup">

    <video id="jajaVideo"
      src="imagenes/jaja.mp4"
      playsinline preload="auto"></video>

    <div class="jaja-text" id="jajaText">eso era todo ❤️</div>

    <button class="jaja-button" id="jajaButton">
      mentira,ahora sí dale aqui jajaj
    </button>

  </div>

</div>

<div class="info-panel" id="infoPanel">

  <div>
    <span class="quote-mark">“</span>
    <span class="song-title" id="songTitle"></span>
    <span class="quote-mark">”</span>
  </div>

  <div class="artist-name" id="artistName"></div>

  <div class="custom-player">

    <div class="progress-container">
      <span class="time-stamp" id="currentTime">0:00</span>

      <input type="range" class="progress-bar"
        id="progressBar" value="0" min="0" max="100">

      <span class="time-stamp" id="remainingTime">-0:00</span>
    </div>

    <div class="player-controls">

      <button class="ctrl-icon-btn" id="prevBtn" onclick="prevTrack()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
        </svg>
      </button>

      <button class="ctrl-icon-btn play-pause-btn"
        id="playPauseBtn" onclick="togglePlayPause()">

        <svg id="playIcon" width="24" height="24"
          viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>

        <svg id="pauseIcon" width="24" height="24"
          viewBox="0 0 24 24" fill="currentColor" style="display:none;">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>

      </button>

      <button class="ctrl-icon-btn" id="nextBtn" onclick="nextTrack()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
        </svg>
      </button>

    </div>
  </div>

  <div class="dedication-box" id="dedicationBox"></div>

  <audio id="audioPlayer" preload="auto"></audio>

  <button class="action-btn" id="toLettersBtn"
    onclick="transitionToLetters()">
    ¿Quieres ver qué sigue? ✦
  </button>

</div>

<script>
const playlist = [
  {
    title:"Gong Li",
    artist:"Red Hot Chili Peppers",
    cover:"imagenes/R1.png",
    audioUrl:"./Audio/Gong.mp3",
    text:"Pensar en ti me hace darme cuenta de cuánto han cambiado las cosas, y lo digo con mucho cariño. Después de tanto tiempo y de tantas cosas que han pasado, sigues siendo tú. Te tengo un cariño enorme y ten por seguro que quiero seguir conociendo esa parte de ti que no todos tienen el placer de conocer."
  },
  {
    title:"Tangelo",
    artist:"Red Hot Chili Peppers",
    cover:"imagenes/R2.png",
    audioUrl:"./Audio/tan.mp3",
    text:"Creo que esta canción siempre me traerá a ti. Todos los momentos que pasé y paso contigo los termino recordando como algo lindo, y me da esa sensación de que, aunque pase el tiempo, siempre tendrán un gran valor sentimental para mí. Eres alguien increíble y pienso que eres tú quien hace especiales esos momentos."
  },
  {
    title:"How Deep Is Your Love",
    artist:"Bee Gees / John Frusciante",
    cover:"imagenes/J2.png",
    audioUrl:"./Audio/how.mp3",
    text:"A veces me pregunto si lo que tuvimos podría volver a ser igual, siempre he tenido esa duda, pero sin duda sé que la respuesta es no, y está bien. Porque creo que lo que no se irá es el cariño que nos tenemos. Espero poder seguir pasando más tiempo contigo y seguir compartiendo momentos juntos."
  },
  {
    title:"Your Song",
    artist:"John Frusciante (Elton John cover)",
    cover:"imagenes/J4.png",
    audioUrl:"./Audio/yours.mp3",
    text:"Para resumir, si tuviera que decirte “escucha esto y sabrás lo que siento”, sería esta. Es sencillo y fácil de entender, ¿no? No sé qué pasará entre nosotros y tampoco me preocupa... solo sé que voy a seguir agradeciendo cada momento que pase contigo, las veces que sean. En serio, no sabes lo feliz que me haces."
  },
  {
    title:"Late Night Talking",
    artist:"Harry Styles",
    cover:"imagenes/H1.jpg",
    audioUrl:"./Audio/late.mp3",
    text:"Esta canción no creo que necesite mucha explicación, tú sabes perfectamente por qué me recuerda a ti. Es de esas canciones que apenas escucho me lleva directamente a nosotros y a tantos momentos que compartimos. Creo que siempre va a tener algo especial para mí simplemente por eso, porque es muy nuestra."
  },
  {
    title:"As It Was",
    artist:"Harry Styles",
    cover:"imagenes/H2.jpg",
    audioUrl:"./Audio/as.mp3",
    text:"Creo que esta canción siempre va a ser muy de nosotros, y aunque hayan cambiado tantas cosas desde que me la dedicaste, cada vez que la escucho inevitablemente pienso en ti. Es raro cómo una canción puede guardar tantos recuerdos y hacerte sentir de nuevo algo que pasó hace tanto tiempo."
  }
];

let currentIndex=0;
let isStarted=false;

const audioPlayer=document.getElementById('audioPlayer');
const vinylContainer=document.getElementById('vinylContainer');
const record=document.getElementById('record');
const sleeve=document.getElementById('sleeve');
const recordLabel=document.getElementById('recordLabel');
const headerPhrase=document.getElementById('headerPhrase');
const infoPanel=document.getElementById('infoPanel');
const songTitle=document.getElementById('songTitle');
const artistName=document.getElementById('artistName');
const dedicationBox=document.getElementById('dedicationBox');
const clickHint=document.getElementById('clickHint');
const toLettersBtn=document.getElementById('toLettersBtn');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const playIcon=document.getElementById('playIcon');
const pauseIcon=document.getElementById('pauseIcon');
const progressBar=document.getElementById('progressBar');
const currentTimeEl=document.getElementById('currentTime');
const remainingTimeEl=document.getElementById('remainingTime');

const jajaOverlay=document.getElementById('jajaOverlay');
const jajaVideo=document.getElementById('jajaVideo');
const jajaText=document.getElementById('jajaText');
const jajaButton=document.getElementById('jajaButton');

loadTextDataOnly(currentIndex);

function loadTextDataOnly(index){
  const track=playlist[index];

  songTitle.textContent=track.title;
  artistName.textContent=track.artist;
  dedicationBox.textContent=`"${track.text}"`;

  audioPlayer.src=track.audioUrl;
  audioPlayer.load();

  prevBtn.disabled=index===0;
  nextBtn.disabled=index===playlist.length-1;

  toLettersBtn.style.display=
    index===playlist.length-1 ? "inline-block" : "none";
}

function loadTrackData(index){
  const track=playlist[index];

  sleeve.style.backgroundImage=`url('${track.cover}')`;
  recordLabel.style.backgroundImage=`url('${track.cover}')`;

  loadTextDataOnly(index);
}

vinylContainer.addEventListener('click',function(){

  if(isStarted)return;

  isStarted=true;

  const puppyVideo=document.getElementById('puppyVideo');

  if(puppyVideo){
    puppyVideo.classList.add('fade-out-video');
  }

  headerPhrase.classList.add('fade-out');
  clickHint.style.display='none';

  setTimeout(()=>{

    jajaOverlay.classList.add('show');
    jajaVideo.currentTime=0;

    jajaVideo.play().catch(e=>{
      console.log("Error con Jaja.mp4:",e);
    });

  },250);

  setTimeout(()=>{
    headerPhrase.style.display='none';
  },800);
});

jajaVideo.addEventListener('timeupdate', function(){
  if(jajaVideo.currentTime >= 0.9 && !jajaText.classList.contains('visible')){
    jajaText.classList.add('visible');
  }
});

jajaVideo.addEventListener('ended',function(){
  jajaText.classList.remove('visible');

  setTimeout(() => {
    jajaButton.classList.add('visible');
  }, 500);
});

jajaButton.addEventListener('click',function(){
  jajaVideo.pause();
  jajaOverlay.classList.remove('show');

  setTimeout(()=>{
    loadTrackData(currentIndex);
    infoPanel.classList.add('visible');

    audioPlayer.play().catch(e=>{
      console.log("Error de reproducción:",e);
    });
  },500);
});

function togglePlayPause(){
  if(audioPlayer.paused){
    audioPlayer.play();
  }else{
    audioPlayer.pause();
  }
}

audioPlayer.addEventListener('play',()=>{
  record.classList.add('spinning');
  playIcon.style.display='none';
  pauseIcon.style.display='block';
});

audioPlayer.addEventListener('pause',()=>{
  record.classList.remove('spinning');
  playIcon.style.display='block';
  pauseIcon.style.display='none';
});

audioPlayer.addEventListener('ended',()=>{
  if(currentIndex<playlist.length-1){
    nextTrack();
  }
});

audioPlayer.addEventListener('timeupdate',()=>{

  if(audioPlayer.duration){

    const progressPercent=
      (audioPlayer.currentTime/audioPlayer.duration)*100;

    progressBar.value=progressPercent;

    currentTimeEl.textContent=
      formatTime(audioPlayer.currentTime);

    const remaining=
      audioPlayer.duration-audioPlayer.currentTime;

    remainingTimeEl.textContent=
      `-${formatTime(remaining)}`;
  }
});

progressBar.addEventListener('input',()=>{

  if(audioPlayer.duration){

    audioPlayer.currentTime=
      (progressBar.value/100)*audioPlayer.duration;
  }
});

function formatTime(seconds){

  const mins=Math.floor(seconds/60);
  const secs=Math.floor(seconds%60);

  return `${mins}:${secs<10?'0':''}${secs}`;
}

function nextTrack(){

  if(currentIndex<playlist.length-1){

    currentIndex++;
    switchTrackWithFade();
  }
}

function prevTrack(){

  if(currentIndex>0){

    currentIndex--;
    switchTrackWithFade();
  }
}

function switchTrackWithFade(){

  audioPlayer.pause();
  record.classList.remove('spinning');

  sleeve.classList.add('fade-content');
  songTitle.classList.add('fade-content');
  artistName.classList.add('fade-content');
  dedicationBox.classList.add('fade-content');

  setTimeout(()=>{

    loadTrackData(currentIndex);

    sleeve.classList.remove('fade-content');
    songTitle.classList.remove('fade-content');
    artistName.classList.remove('fade-content');
    dedicationBox.classList.remove('fade-content');

    audioPlayer.play().catch(e=>console.log(e));

  },300);
}

function transitionToLetters(){
  window.location.href='Cartas.html';
}
</script>

</body>
</html>
