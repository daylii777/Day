<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuenta Regresiva ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Stoke:wght@400&family=Roboto+Condensed:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      color: #ffffff;
      font-family: 'Afacad Flux', sans-serif;
      min-height: 100vh;
      min-height: 100lvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
    }

    .btn-regresar {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 2rem;
      color: #ffffff;
      text-decoration: none;
      z-index: 10;
      transition: transform 0.2s ease, opacity 0.2s ease;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .btn-regresar:hover {
      transform: scale(1.15);
      opacity: 0.8;
    }

    /* Contenedor de la marquesina superior en la zona marcada */
    .marquesina-cancion {
      position: absolute;
      top: 20px;
      left: 60px;
      right: 20px;
      height: 25px;
      overflow: hidden;
      z-index: 10;
      display: flex;
      align-items: center;
    }

    .info-cancion {
      font-size: clamp(0.75rem, 2.5vw, 0.85rem);
      color: rgba(255, 255, 255, 0.85);
      font-family: 'Roboto Condensed', sans-serif;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
      display: inline-block;
      position: absolute;
      will-change: transform;
      animation: desplazarTexto 12s linear infinite;
      animation-play-state: paused; /* Pausado hasta que inicie la música */
    }

    @keyframes desplazarTexto {
      0% {
        transform: translateX(100%);
      }
      100% {
        transform: translateX(-100%);
      }
    }

    #btnStart {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #80182e;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 1.3rem;
      padding: 16px 32px;
      border: 4px solid #000000;
      border-radius: 0px;
      box-shadow: 
        -4px -4px 0px 0px #ff6688 inset,
        4px 4px 0px 0px #800020 inset,
        6px 6px 0px 0px #000000;
      cursor: pointer;
      z-index: 1000;
      transition: transform 0.1s ease;
    }

    #btnStart:active {
      transform: translate(-48%, -48%);
      box-shadow: 2px 2px 0px 0px #000000;
    }

    #btnStart.ocultar {
      opacity: 0;
      pointer-events: none;
    }
  
    .contenedor-desenfocable {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      transition: filter 0.6s ease;
    }

    .modo-blur {
      filter: blur(8px);
      pointer-events: none;
    }

    .fondo-pantalla {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100lvh;
      object-fit: cover;
      z-index: -2;
    }

    .capa-oscura {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100lvh;
      background: rgba(0, 0, 0, 0.45);
      z-index: -1;
    }

    .contenido-principal {
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 420px;
      width: 90vw;
      margin: auto 0;
      padding: 20px 0;
    }

    .gif-decorativo {
      width: clamp(70px, 15vw, 95px);
      height: auto;
      margin-bottom: 12px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
    }

    .temporizador {
      display: flex;
      gap: clamp(8px, 3vw, 18px);
      justify-content: center;
      margin-bottom: 25px;
      width: 100%;
    }

    .bloque-tiempo {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 50px;
    }

    .numero {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 7vw, 2.6rem);
      font-weight: 600;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .etiqueta {
      font-size: clamp(0.7rem, 2.2vw, 0.8rem);
      color: #e0e0e0;
      text-transform: uppercase;
      margin-top: 6px;
      letter-spacing: 1px;
    }

    .contenedor-cita {
      min-height: 75px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .cita-texto {
      font-family: 'Stoke', serif;
      font-size: clamp(0.95rem, 3.4vw, 1.15rem);
      line-height: 1.5;
      color: #ffffff;
      font-weight: 400;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .definicion-diccionario {
      margin-top: 10px;
      text-align: left;
      width: 100%;
      padding: 0 10px;
      opacity: 0.6;
    }

    .encabezado-palabra {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .palabra-titulo {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.7rem, 6vw, 2.2rem);
      font-weight: 600;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .fonetica, .categoria {
      font-family: 'Playfair Display', serif;
      font-size: clamp(0.85rem, 3vw, 0.95rem);
      color: #e0e0e0;
      font-style: italic;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    .texto-definicion {
      font-family: 'Afacad Flux', sans-serif;
      font-size: clamp(0.85rem, 3vw, 0.95rem);
      line-height: 1.5;
      color: #f0f0f0;
      font-weight: 400;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>

  <a href="Cartas.html" class="btn-regresar" title="Volver a Cartas">‹</a>

  <!-- Zona superior en marquesina con el título exacto -->
  <div class="marquesina-cancion">
    <div id="infoCancion" class="info-cancion"></div>
  </div>

  <button id="btnStart" onclick="iniciarExperiencia()">START</button>

  <img id="imagenFondo" src="imagenes/f1.jpg" alt="Fondo del día" class="fondo-pantalla">
  
  <div class="capa-oscura"></div>

  <div id="contenedorBlur" class="contenedor-desenfocable modo-blur">
    <div class="contenido-principal">
      <img src="imagenes/Gif.gif" alt="Gatos animando" class="gif-decorativo">

      <div class="temporizador">
        <div class="bloque-tiempo">
          <span class="numero" id="dias">00</span>
          <span class="etiqueta">Días</span>
        </div>
        <div class="bloque-tiempo">
          <span class="numero" id="horas">00</span>
          <span class="etiqueta">Hs</span>
        </div>
        <div class="bloque-tiempo">
          <span class="numero" id="minutos">00</span>
          <span class="etiqueta">Min</span>
        </div>
        <div class="bloque-tiempo">
          <span class="numero" id="segundos">00</span>
          <span class="etiqueta">Seg</span>
        </div>
      </div>

      <div class="contenedor-cita">
        <p id="citaTexto" class="cita-texto"></p>
      </div>

      <div class="definicion-diccionario">
        <div class="encabezado-palabra">
          <span class="palabra-titulo">love:</span>
          <span class="fonetica">|lŭv|</span>
          <span class="categoria">- n.</span>
        </div>
        <p class="texto-definicion">
          1. an intense affection for another person based on personal or familial ties 2. the deep tenderness, affection, and concern felt for a person with whom one has a relationship.
        </p>
      </div>
    </div>
  </div>

  <script>
    // Playlist con tus canciones y su relación exacta con cada archivo SongX
    const playlist = [
      { archivo: 'audio/Song1.mp3', titulo: 'Until I Found You', artista: 'Stephen Sanchez' },
      { archivo: 'audio/Song2.mp3', titulo: 'Love of Your Life', artista: 'Red Hot Chili Peppers' },
      { archivo: 'audio/Song3.mp3', titulo: 'Hey', artista: 'Red Hot Chili Peppers' },
      { archivo: 'audio/Song4.mp3', titulo: 'Química Mayor', artista: 'Mon Laferte' },
      { archivo: 'audio/Song5.mp3', titulo: 'Lovable', artista: 'Kim Jong Kook' },
      { archivo: 'audio/Song6.mp3', titulo: 'Risk It All', artista: 'Bruno Mars' }
    ];

    let audioActual = null;

    function reproducirCancionAleatoria() {
      // Elige un índice al azar entre 0 y 5
      const randomIndex = Math.floor(Math.random() * playlist.length);
      const cancionSeleccionada = playlist[randomIndex];

      if (audioActual) {
        audioActual.pause();
      }

      audioActual = new Audio(cancionSeleccionada.archivo);
      audioActual.volume = 0.6;

      audioActual.play().then(() => {
        console.log("Reproduciendo al azar:", cancionSeleccionada.titulo);
      }).catch(e => {
        console.log("Error al reproducir audio:", e);
      });

      // Muestra exactamente el título y artista correspondientes a la canción elegida al azar
      const infoElement = document.getElementById('infoCancion');
      if (infoElement) {
        infoElement.innerText = `♫ Reproduciendo: "${cancionSeleccionada.titulo}" — ${cancionSeleccionada.artista}`;
        infoElement.style.animationPlayState = 'running';
      }

      // Cuando termine esta canción, vuelve a elegir otra al azar en bucle
      audioActual.onended = function() {
        reproducirCancionAleatoria();
      };
    }

    function iniciarExperiencia() {
      const contenedor = document.getElementById('contenedorBlur');
      if (contenedor) {
        contenedor.classList.remove('modo-blur');
      }

      const btn = document.getElementById('btnStart');
      if (btn) {
        btn.classList.add('ocultar');
      }

      reproducirCancionAleatoria();
    }

    const frasesFilosoficas = [
      "Platón — «Amar es desear que el otro alcance aquello que lo hace verdaderamente feliz.»",
      "Aristóteles — «Amar es querer el bien del otro por el bien del otro.»",
      "Séneca — «Si quieres ser amado, ama.»",
      "Epicteto — «El amor también consiste en aprender a aceptar aquello que no podemos poseer.»",
      "Marco Aurelio — «Acostúmbrate a escuchar lo que dice el otro y, en la medida de lo posible, entra en su alma.»",
      "Kierkegaard — «El amor es la expresión de la libertad cuando decide entregarse sin dejar de ser ella misma.»",
      "Nietzsche — «Hay siempre algo de locura en el amor, pero también algo de razón en la locura.»",
      "Schopenhauer — «El amor es una ilusión mediante la cual la naturaleza asegura la continuidad de la vida.»",
      "Erich Fromm — «El amor es la única respuesta sensata y satisfactoria al problema de la existencia humana.»",
      "Simone de Beauvoir — «El amor auténtico debería fundarse en el reconocimiento recíproco de dos libertades.»",
      "Jean-Paul Sartre — «El amor es un intento de capturar la libertad del otro.»",
      "Albert Camus — «No ser amado es una simple desgracia; la verdadera desgracia es no amar.»",
      "Cioran — «El amor es una especie de enfermedad mental.»",
      "Ortega y Gasset — «El amor es un estado de gracia que se apodera del hombre y lo transforma.»",
      "Montaigne — «Si me preguntan por qué lo amaba, siento que esto no puede expresarse sino respondiendo: porque era él, porque era yo.»",
      "Rousseau — «El amor es una pasión que busca la felicidad del ser amado.»",
      "Pascal — «El corazón tiene razones que la razón no conoce.»",
      "Spinoza — «El amor es una alegría acompañada por la idea de una causa exterior.»",
      "Hegel — «El amor es, en general, la conciencia de mi unidad con otro.»",
      "Schiller — «El amor es la belleza del alma.»",
      "Voltaire — «El amor es la más fuerte de las pasiones, porque ataca a la vez la cabeza, el corazón y los sentidos.»",
      "San Agustín — «Ama y haz lo que quieras.»",
      "Ovidio — «Si quieres ser amado, sé digno de amor.»",
      "Séneca — «Una de las más bellas cualidades de la verdadera amistad es comprender y ser comprendido.»",
      "Confucio — «Donde hay amor, hay vida.»",
      "Tagore — «El amor no reclama posesiones, sino que da libertad.»"
    ];

    const indiceAleatorio = Math.floor(Math.random() * frasesFilosoficas.length);
    document.getElementById("citaTexto").innerText = frasesFilosoficas[indiceAleatorio];

    const fondosPorFecha = {
      "2026-08-26": "imagenes/f1.jpg",
      "2026-08-27": "imagenes/f1.jpg",
      "2026-08-28": "imagenes/f2.jpeg",
      "2026-08-29": "imagenes/f2.jpeg",
      "2026-08-30": "imagenes/f3.jpeg",
      "2026-08-31": "imagenes/f3.jpeg",
      "2026-09-01": "imagenes/f4.jpg",
      "2026-09-02": "imagenes/f4.jpg",
      "2026-09-03": "imagenes/f4.jpg",
      "2026-09-04": "imagenes/f5.jpg",
      "2026-09-05": "imagenes/f5.jpg",
      "2026-09-06": "imagenes/f5.jpg",
      "2026-09-07": "imagenes/f6.jpg",
      "2026-09-08": "imagenes/f6.jpg"
    };

    const fechaObjetivo = new Date("2026-09-08T00:00:00").getTime();

    function actualizarTemporizadorYFondo() {
      const ahora = new Date();
      const ao = ahora.getFullYear();
      const mes = String(ahora.getMonth() + 1).padStart(2, '0');
      const dia = String(ahora.getDate()).padStart(2, '0');
      const claveHoy = `${ao}-${mes}-${dia}`;

      const fondoHoy = fondosPorFecha[claveHoy] || "imagenes/f1.jpg";
      const imgElem = document.getElementById("imagenFondo");
      if (imgElem && imgElem.getAttribute("src") !== fondoHoy) {
        imgElem.src = fondoHoy;
      }

      const diferencia = fechaObjetivo - ahora.getTime();
      if (diferencia <= 0) return;

      const d = Math.floor(diferencia / (1000 * 60 * 60 * 24));
      const h = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((diferencia % (1000 * 60)) / 1000);

      document.getElementById("dias").innerText = String(d).padStart(2, '0');
      document.getElementById("horas").innerText = String(h).padStart(2, '0');
      document.getElementById("minutos").innerText = String(m).padStart(2, '0');
      document.getElementById("segundos").innerText = String(s).padStart(2, '0');
    }

    setInterval(actualizarTemporizadorYFondo, 1000);
    actualizarTemporizadorYFondo();
  </script>

</body>
</html>
