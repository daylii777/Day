<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuenta Regresiva ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      min-height: 100lvh; /* 📱 Adapta la altura exacta en navegadores móviles */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      overflow-x: hidden;
      overflow-y: auto; /* 📜 Permite desplazamiento si la pantalla del móvil es baja */
      position: relative;
    }

    /* ⬅️ Botón para regresar a Cartas.html */
    .btn-regresar {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 2rem;
      color: #ffffff;
      text-decoration: none;
      z-index: 10;
      transition: transform 0.2s ease, opacity 0.2s ease;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .btn-regresar:hover {
      transform: scale(1.15);
      opacity: 0.8;
    }

    /* 🖼️ Imagen de fondo completa */
    .fondo-pantalla {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100lvh;
      object-fit: cover;
      z-index: -2;
      transition: opacity 0.8s ease;
    }

    /* 🖤 Capa tenue de oscuridad */
    .capa-oscura {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100lvh;
      background: rgba(0, 0, 0, 0.45);
      z-index: -1;
    }

    /* Contenido superpuesto adaptativo */
    .contenido-principal {
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 420px;
      width: 90vw;
      margin: auto 0; /* Centrado vertical flexible */
      padding: 20px 0;
    }

    /* 🐱 GIF pequeño sobre el temporizador */
    .gif-decorativo {
      width: clamp(70px, 15vw, 95px);
      height: auto;
      margin-bottom: 12px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
    }

    /* Temporizador adaptativo */
    .temporizador {
      display: flex;
      gap: clamp(8px, 3vw, 18px);
      justify-content: center;
      margin-bottom: 25px;
      width: 100%;
    }

    .bloque-tiempo {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 50px;
    }

    .numero {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 7vw, 2.6rem);
      font-weight: 600;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .etiqueta {
      font-size: clamp(0.65rem, 2vw, 0.75rem);
      color: #e0e0e0;
      text-transform: uppercase;
      margin-top: 6px;
      letter-spacing: 1px;
    }

    /* Cita / Frase del filósofo */
    .contenedor-cita {
      min-height: 75px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .cita-texto {
      font-family: 'Playfair Display', serif;
      font-size: clamp(0.9rem, 3.2vw, 1.08rem);
      line-height: 1.5;
      color: #ffffff;
      font-style: italic;
      font-weight: 400;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    /* 📖 Estilo Diccionario */
    .definicion-diccionario {
      margin-top: 20px;
      text-align: left;
      width: 100%;
      padding: 0 10px;
    }

    .encabezado-palabra {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .palabra-titulo {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.7rem, 6vw, 2.2rem);
      font-weight: 600;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .fonetica, .categoria {
      font-family: 'Playfair Display', serif;
      font-size: clamp(0.85rem, 3vw, 0.95rem);
      color: #e0e0e0;
      font-style: italic;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    .texto-definicion {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(0.78rem, 2.8vw, 0.85rem);
      line-height: 1.5;
      color: #f0f0f0;
      font-weight: 400;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>

  <!-- ⬅️ Flecha para volver a Cartas.html -->
  <a href="Cartas.html" class="btn-regresar" title="Volver a Cartas">‹</a>

  <!-- Imagen de fondo -->
  <img id="imagenFondo" src="" alt="Fondo del día" class="fondo-pantalla">
  
  <!-- Capa negra tenue -->
  <div class="capa-oscura"></div>

  <!-- Contenido -->
  <div class="contenido-principal">
    
    <!-- 🐱 GIF animado -->
    <img src="imagenes/Gif.gif" alt="Gatos animando" class="gif-decorativo">

    <!-- Temporizador -->
    <div class="temporizador">
      <div class="bloque-tiempo">
        <span class="numero" id="dias">00</span>
        <span class="etiqueta">Días</span>
      </div>
      <div class="bloque-tiempo">
        <span class="numero" id="horas">00</span>
        <span class="etiqueta">Hs</span>
      </div>
      <div class="bloque-tiempo">
        <span class="numero" id="minutos">00</span>
        <span class="etiqueta">Min</span>
      </div>
      <div class="bloque-tiempo">
        <span class="numero" id="segundos">00</span>
        <span class="etiqueta">Seg</span>
      </div>
    </div>

    <!-- Cita o frase del día (Aleatoria) -->
    <div class="contenedor-cita">
      <p id="citaTexto" class="cita-texto"></p>
    </div>

    <!-- 📖 Definición tipo diccionario -->
    <div class="definicion-diccionario">
      <div class="encabezado-palabra">
        <span class="palabra-titulo">love:</span>
        <span class="fonetica">|lŭv|</span>
        <span class="categoria">- n.</span>
      </div>
      <p class="texto-definicion">
        1. an intense affection for another person based on personal or familial ties 2. the deep tenderness, affection, and concern felt for a person with whom one has a relationship.
      </p>
    </div>

  </div>

  <script>
    const frasesFilosoficas = [
      "Platón — «Amar es desear que el otro alcance aquello que lo hace verdaderamente feliz.»",
      "Aristóteles — «Amar es querer el bien del otro por el bien del otro.»",
      "Séneca — «Si quieres ser amado, ama.»",
      "Epicteto — «El amor también consiste en aprender a aceptar aquello que no podemos poseer.»",
      "Marco Aurelio — «Acostúmbrate a escuchar lo que dice el otro y, en la medida de lo posible, entra en su alma.»",
      "Marco Aurelio — «Acostúmbrate a pensar que aquello que amas es mortal, para aprender a amarlo sin poseerlo.»",
      "Epicuro — «De todas las cosas que procura la sabiduría para la felicidad, la mayor es la amistad y el amor.»",
      "Blaise Pascal — «El corazón tiene razones que la razón no comprende.»",
      "Gottfried Leibniz — «Amar es encontrar placer en la felicidad de otro.»",
      "David Hume — «La belleza de las cosas existe en el espíritu de quien las contempla.»",
      "Jean-Jacques Rousseau — «El amor propio es una pasión natural que nos lleva a buscar nuestra felicidad.»",
      "Immanuel Kant — «El amor práctico consiste en hacer el bien incluso cuando no sentimos inclinación hacia ello.»",
      "Arthur Schopenhauer — «El amor es una ilusión mediante la cual la naturaleza asegura la continuidad de la vida.»",
      "Søren Kierkegaard — «El amor es la expresión de la libertad cuando decide entregarse sin dejar de ser ella misma.»",
      "Søren Kierkegaard — «El amor es todo; lo da todo y lo toma todo.»",
      "Friedrich Nietzsche — «Hay siempre algo de locura en el amor, pero también hay siempre algo de razón en la locura.»",
      "Ralph Waldo Emerson — «El amor es nuestra mayor fuerza y nuestra mayor debilidad.»",
      "Henry David Thoreau — «El amor no es algo que poseamos, sino algo que vivimos.»",
      "Miguel de Unamuno — «El amor es un sentimiento que busca eternidad.»",
      "José Ortega y Gasset — «El amor es un estado de gracia que transforma nuestra perspectiva sobre el mundo.»",
      "Martin Heidegger — «El amor es aquello que nos permite comprender verdaderamente al otro.»",
      "Jean-Paul Sartre — «El amor busca la libertad del otro y, al mismo tiempo, desea ser elegido por ella.»",
      "Simone de Beauvoir — «El amor auténtico debe fundarse en el reconocimiento de dos libertades.»",
      "Erich Fromm — «El amor es la única respuesta sana y satisfactoria al problema de la existencia humana.»",
      "Hannah Arendt — «El amor, por su propia naturaleza, no es mundano.»",
      "Albert Camus — «Amar es vivir sin aceptar que el absurdo tenga la última palabra.»",
      "Albert Camus — «No ser amado es una simple desgracia; la verdadera desgracia es no amar.»",
      "Emmanuel Levinas — «El amor es responsabilidad por el otro.»",
      "Gilles Deleuze — «Amar es abrirse a mundos que no podríamos descubrir solos.»",
      "Byung-Chul Han — «El amor transforma al otro en un misterio que no puede ser completamente reducido a uno mismo.»",
      "Zygmunt Bauman — «El amor está marcado por el deseo de permanencia en un mundo de incertidumbre.»",
      "Cioran — «El amor es una especie de enfermedad mental.»"
    ];

    const indiceAleatorio = Math.floor(Math.random() * frasesFilosoficas.length);
    document.getElementById("citaTexto").innerText = frasesFilosoficas[indiceAleatorio];

    const fondosPorFecha = {
      "2026-08-26": "imagenes/f1.jpg",
      "2026-08-27": "imagenes/f1.jpg",
      "2026-08-28": "imagenes/f2.jpeg",
      "2026-08-29": "imagenes/f2.jpeg",
      "2026-08-30": "imagenes/f3.jpeg",
      "2026-08-31": "imagenes/f3.jpeg",
      "2026-09-01": "imagenes/f4.jpg",
      "2026-09-02": "imagenes/f4.jpg",
      "2026-09-03": "imagenes/f4.jpg",
      "2026-09-04": "imagenes/f5.jpg",
      "2026-09-05": "imagenes/f5.jpg",
      "2026-09-06": "imagenes/f5.jpg",
      "2026-09-07": "imagenes/f6.jpg",
      "2026-09-08": "imagenes/f6.jpg"
    };

    const fechaObjetivo = new Date("2026-09-08T00:00:00").getTime();

    function actualizarTemporizadorYFondo() {
      const ahora = new Date();
      
      const ao = ahora.getFullYear();
      const mes = String(ahora.getMonth() + 1).padStart(2, '0');
      const dia = String(ahora.getDate()).padStart(2, '0');
      const claveHoy = `${ao}-${mes}-${dia}`;

      const fondoHoy = fondosPorFecha[claveHoy] || "imagenes/f1.jpg";
      const imgElem = document.getElementById("imagenFondo");
      if (imgElem.getAttribute("src") !== fondoHoy) {
        imgElem.src = fondoHoy;
      }

      const diferencia = fechaObjetivo - ahora.getTime();

      if (diferencia <= 0) {
        document.getElementById("dias").innerText = "00";
        document.getElementById("horas").innerText = "00";
        document.getElementById("minutos").innerText = "00";
        document.getElementById("segundos").innerText = "00";
        return;
      }

      const d = Math.floor(diferencia / (1000 * 60 * 60 * 24));
      const h = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((diferencia % (1000 * 60)) / 1000);

      document.getElementById("dias").innerText = String(d).padStart(2, '0');
      document.getElementById("horas").innerText = String(h).padStart(2, '0');
      document.getElementById("minutos").innerText = String(m).padStart(2, '0');
      document.getElementById("segundos").innerText = String(s).padStart(2, '0');
    }

    setInterval(actualizarTemporizadorYFondo, 1000);
    actualizarTemporizadorYFondo();
  </script>

</body>
</html>
