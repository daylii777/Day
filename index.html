<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Y si hasta en la música te encuentro?</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,600;1,6..96,800&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      background-color: #0d0d0d;
      color: #f4efe6;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 15px;
    }

    .background-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100lvh; 
      background-image: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.9)), url('imagenes/fondo.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: grayscale(100%) contrast(110%);
      z-index: -1;
      transform: translateZ(0); 
    }

    /* 🔤 Frase inicial adaptable entre móvil y PC */
    .header-phrase {
      font-family: 'Bodoni Moda', serif;
      font-style: italic;
      font-weight: 800;
      color: #ffffff;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      text-align: center;
      margin-top: 5px;
      margin-bottom: 25px;
      transition: opacity 0.8s ease, transform 0.8s ease;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9);
    }

    .header-phrase.fade-out {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }

    /* 🚫 Eliminado el resplandor/marcado azul al hacer clic */
    .vinyl-container,
    .ctrl-icon-btn,
    .action-btn,
    .progress-bar {
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .vinyl-container {
      position: relative;
      width: 260px;
      height: 260px;
      cursor: pointer;
      user-select: none;
      margin-bottom: 25px;
      transition: transform 0.3s ease;
    }

    /* 🍷 Portada inicial con color vino oscuro */
    .sleeve {
      position: absolute;
      top: 0;
      left: 0;
      width: 240px;
      height: 240px;
      background-color: #4a0e17; 
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 2px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
      z-index: 2;
      transition: opacity 0.4s ease, background-image 0.5s ease;
    }

    .record {
      position: absolute;
      top: 10px;
      right: -20px;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, #151515 30%, #2b2b2b 31%, #111111 70%);
      border-radius: 50%;
      box-shadow: 1px 4px 12px rgba(0,0,0,0.6);
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 🍷 Centro del vinilo inicial con color vino oscuro */
    .record-label {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background-color: #4a0e17; 
      background-size: cover;
      background-position: center;
      transition: background-image 0.5s ease;
    }

    .spinning { animation: spin 3.5s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .click-hint {
      position: absolute;
      bottom: -28px;
      width: 100%;
      text-align: center;
      font-size: 0.7rem;
      color: #cccccc;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 300;
    }

    /* 📱 Panel responsivo seguro para móviles */
    .info-panel {
      max-width: 420px;
      width: 90vw;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .info-panel.visible { opacity: 1; transform: translateY(0); }
    .fade-content { opacity: 0 !important; transition: opacity 0.4s ease; }

    .song-title {
      font-family: 'Bodoni Moda', serif;
      font-style: italic;
      font-size: 1.5rem;
      color: #ffffff;
      margin-bottom: 2px;
      transition: opacity 0.4s ease;
    }

    .quote-mark {
      font-family: 'Bodoni Moda', serif;
      font-size: 1.6rem;
      margin: 0 4px;
    }

    .artist-name {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      color: #ffffff;
      font-weight: 600;
      margin-top: 5px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 3px;
      transition: opacity 0.4s ease;
    }

    .custom-player {
      width: 100%;
      margin-bottom: 20px;
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .time-stamp {
      font-size: 0.7rem;
      color: #cccccc;
      font-weight: 400;
      min-width: 35px;
    }

    .progress-bar {
      flex-grow: 1;
      height: 3px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.3);
      outline: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
    }

    .ctrl-icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .ctrl-icon-btn:hover { transform: scale(1.1); }
    .ctrl-icon-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

    .play-pause-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffffff;
      color: #000000;
    }

    .dedication-box {
      background-color: #f4efe6;
      color: #1a1a1a;
      padding: 25px 20px;
      margin-top: 10px;
      margin-bottom: 15px;
      position: relative;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      line-height: 1.6;
      text-align: left;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      transition: opacity 0.4s ease;
      
      mask: radial-gradient(circle 5px at 10px 0, #0000 99%, #000 100%) 0 -5px / 20px 100% repeat-x,
            radial-gradient(circle 5px at 10px 100%, #0000 99%, #000 100%) 0 calc(100% + 5px) / 20px 100% repeat-x,
            radial-gradient(circle 5px at 0 10px, #0000 99%, #000 100%) -5px 0 / 100% 20px repeat-y,
            radial-gradient(circle 5px at 100% 10px, #0000 99%, #000 100%) calc(100% + 5px) 0 / 100% 20px repeat-y;
      -webkit-mask: radial-gradient(circle 5px at 10px 0, #0000 99%, #000 100%) 0 -5px / 20px 100% repeat-x,
                    radial-gradient(circle 5px at 10px 100%, #0000 99%, #000 100%) 0 calc(100% + 5px) / 20px 100% repeat-x,
                    radial-gradient(circle 5px at 0 10px, #0000 99%, #000 100%) -5px 0 / 100% 20px repeat-y,
                    radial-gradient(circle 5px at 100% 10px, #0000 99%, #000 100%) calc(100% + 5px) 0 / 100% 20px repeat-y;
    }

    .action-btn {
      display: none;
      margin: 25px auto 0;
      padding: 15px 30px;
      background-color: #581825;
      color: #ffffff;
      border: none;
      font-weight: 600;
      font-size: 0.86rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .action-btn:hover { background-color: #581825; transform: translateY(-2px); }

    /* 📱 Ajuste para teléfonos con pantalla muy estrecha */
    @media (max-width: 380px) {
      .vinyl-container {
        transform: scale(0.85);
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="background-overlay"></div>

  <div class="header-phrase" id="headerPhrase">¿Y si hasta en la música te encuentro?</div>

  <div class="vinyl-container" id="vinylContainer">
    <div class="sleeve" id="sleeve"></div>
    <div class="record" id="record">
      <div class="record-label" id="recordLabel"></div>
    </div>
    <div class="click-hint" id="clickHint">Toca la portada para comenzar</div>
  </div>

  <div class="info-panel" id="infoPanel">
    <div>
      <span class="quote-mark">“</span>
      <span class="song-title" id="songTitle"></span>
      <span class="quote-mark">”</span>
    </div>
    <div class="artist-name" id="artistName"></div>
    
    <div class="custom-player">
      <div class="progress-container">
        <span class="time-stamp" id="currentTime">0:00</span>
        <input type="range" class="progress-bar" id="progressBar" value="0" min="0" max="100">
        <span class="time-stamp" id="remainingTime">-0:00</span>
      </div>

      <div class="player-controls">
        <button class="ctrl-icon-btn" id="prevBtn" onclick="prevTrack()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <button class="ctrl-icon-btn play-pause-btn" id="playPauseBtn" onclick="togglePlayPause()">
          <svg id="playIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <button class="ctrl-icon-btn" id="nextBtn" onclick="nextTrack()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>

    <div class="dedication-box" id="dedicationBox"></div>
    
    <audio id="audioPlayer" preload="auto"></audio>

    <button class="action-btn" id="toLettersBtn" onclick="transitionToLetters()">¿Quieres ver qué sigue? ✦</button>
  </div>

  <script>
    const playlist = [
      {
        title: "Gong Li",
        artist: "Red Hot Chili Peppers",
        cover: "imagenes/R1.png",
        audioUrl: "./audio/Gong.mp3",
        text: "Pensar en ti me hace darme cuenta de cuánto han cambiado las cosas, y lo digo con mucho cariño. Después de tanto tiempo y de tantas cosas que han pasado, sigues siendo tú. Te tengo un cariño enorme y ten por seguro que quiero seguir conociendo esa parte de ti que no todos tienen el placer de conocer."
      },
      {
        title: "Tangelo",
        artist: "Red Hot Chili Peppers",
        cover: "imagenes/R2.png",
        audioUrl: "./audio/tan.mp3",
        text: "Creo que esta canción siempre me traerá a ti. Todos los momentos que pasé y paso contigo los termino recordando como algo lindo, y me da esa sensación de que, aunque pase el tiempo, siempre tendrán un gran valor sentimental para mí. Eres alguien increíble y pienso que eres tú quien hace especiales esos momentos."
      },
      {
        title: "How Deep Is Your Love",
        artist: "Bee Gees / John Frusciante",
        cover: "imagenes/J2.png",
        audioUrl: "./audio/how.mp3",
        text: "A veces me pregunto si lo que tuvimos podría volver a ser igual, siempre he tenido esa duda, pero sin duda sé que la respuesta es no, y está bien. Porque creo que lo que no se irá es el cariño que nos tenemos. Espero poder seguir pasando más tiempo contigo y seguir compartiendo momentos juntos."
      },
      {
        title: "Your Song",
        artist: "John Frusciante (Elton John cover)",
        cover: "imagenes/J4.png",
        audioUrl: "./audio/yours.mp3",
        text: "Para resumir, si tuviera que decirte “escucha esto y sabrás lo que siento”, sería esta. Es sencillo y fácil de entender, ¿no? No sé qué pasará entre nosotros y tampoco me preocupa... solo sé que voy a seguir agradeciendo cada momento que pase contigo, las veces que sean. En serio, no sabes lo feliz que me haces."
      },
      {
        title: "Late Night Talking",
        artist: "Harry Styles",
        cover: "imagenes/H1.jpg",
        audioUrl: "./audio/late.mp3",
        text: "Esta canción no creo que necesite mucha explicación, tú sabes perfectamente por qué me recuerda a ti. Es de esas canciones que apenas escucho me lleva directamente a nosotros y a tantos momentos que compartimos. Creo que siempre va a tener algo especial para mí simplemente por eso, porque es muy nuestra."
      },
      {
        title: "As It Was",
        artist: "Harry Styles",
        cover: "imagenes/H2.jpg",
        audioUrl: "./audio/as.mp3",
        text: "Creo que esta canción siempre va a ser muy de nosotros, y aunque hayan cambiado tantas cosas desde que me la dedicaste, cada vez que la escucho inevitablemente pienso en ti. Es raro cómo una canción puede guardar tantos recuerdos y hacerte sentir de nuevo algo que pasó hace tanto tiempo."
      }
    ];

    let currentIndex = 0;
    let isStarted = false;

    const audioPlayer = document.getElementById('audioPlayer');
    const vinylContainer = document.getElementById('vinylContainer');
    const record = document.getElementById('record');
    const sleeve = document.getElementById('sleeve');
    const recordLabel = document.getElementById('recordLabel');
    const headerPhrase = document.getElementById('headerPhrase');
    const infoPanel = document.getElementById('infoPanel');
    const songTitle = document.getElementById('songTitle');
    const artistName = document.getElementById('artistName');
    const dedicationBox = document.getElementById('dedicationBox');
    const clickHint = document.getElementById('clickHint');
    const toLettersBtn = document.getElementById('toLettersBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const remainingTimeEl = document.getElementById('remainingTime');

    loadTextDataOnly(currentIndex);

    function loadTextDataOnly(index) {
      const track = playlist[index];
      songTitle.textContent = track.title;
      artistName.textContent = track.artist;
      dedicationBox.textContent = `"${track.text}"`;
      audioPlayer.src = track.audioUrl;
      audioPlayer.load();
      
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === playlist.length - 1;
      toLettersBtn.style.display = (index === playlist.length - 1) ? "inline-block" : "none";
    }

    function loadTrackData(index) {
      const track = playlist[index];
      sleeve.style.backgroundImage = `url('${track.cover}')`;
      recordLabel.style.backgroundImage = `url('${track.cover}')`;
      loadTextDataOnly(index);
    }

    vinylContainer.addEventListener('click', function() {
      if (!isStarted) {
        isStarted = true;
        loadTrackData(currentIndex);
        headerPhrase.classList.add('fade-out');
        clickHint.style.display = 'none';
        infoPanel.classList.add('visible');
        
        audioPlayer.play().catch(e => console.log(e));
        setTimeout(() => headerPhrase.style.display = 'none', 800);
      }
    });

    function togglePlayPause() {
      if (audioPlayer.paused) {
        audioPlayer.play();
      } else {
        audioPlayer.pause();
      }
    }

    audioPlayer.addEventListener('play', () => {
      record.classList.add('spinning');
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
    });

    audioPlayer.addEventListener('pause', () => {
      record.classList.remove('spinning');
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    });

    // 🔄 Cambio automático de canción al finalizar
    audioPlayer.addEventListener('ended', () => {
      if (currentIndex < playlist.length - 1) {
        nextTrack();
      }
    });

    audioPlayer.addEventListener('timeupdate', () => {
      if (audioPlayer.duration) {
        const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        progressBar.value = progressPercent;
        
        currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
        const remaining = audioPlayer.duration - audioPlayer.currentTime;
        remainingTimeEl.textContent = `-${formatTime(remaining)}`;
      }
    });

    progressBar.addEventListener('input', () => {
      if (audioPlayer.duration) {
        audioPlayer.currentTime = (progressBar.value / 100) * audioPlayer.duration;
      }
    });

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function nextTrack() {
      if (currentIndex < playlist.length - 1) {
        currentIndex++;
        switchTrackWithFade();
      }
    }

    function prevTrack() {
      if (currentIndex > 0) {
        currentIndex--;
        switchTrackWithFade();
      }
    }

    function switchTrackWithFade() {
      audioPlayer.pause();
      record.classList.remove('spinning');
      
      sleeve.classList.add('fade-content');
      songTitle.classList.add('fade-content');
      artistName.classList.add('fade-content');
      dedicationBox.classList.add('fade-content');

      setTimeout(() => {
        loadTrackData(currentIndex);
        
        sleeve.classList.remove('fade-content');
        songTitle.classList.remove('fade-content');
        artistName.classList.remove('fade-content');
        dedicationBox.classList.remove('fade-content');
        
        audioPlayer.play().catch(e => console.log(e));
      }, 400);
    }

    function transitionToLetters() {
      window.location.href = 'Cartas.html';
    }
  </script>
</body>
</html>
